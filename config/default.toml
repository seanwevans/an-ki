# Default configuration for the distributed neural network system
# Values can be overridden with environment variables or `*_FILE` entries provided
# by ConfigMaps. For example, set `AMQP_ADDR` or `AMQP_ADDR_FILE` to override
# `amqp_addr`.

amqp_addr = "amqp://127.0.0.1:5672/%2f"
jwt_secret_key = "change-me"
database_url = "postgresql://root@localhost:26257/defaultdb?sslmode=disable"
otlp_endpoint = "http://localhost:4317"
# Address the task REST API binds to. Override with API_ADDR.
api_addr = "0.0.0.0:3030"
model_shards = 1
training_epochs = 400
# Milliseconds between training epochs.
epoch_interval_ms = 100
# Hidden units in the network; the parameter count follows from this.
hidden_units = 16
# Step size applied to the averaged gradient each epoch.
learning_rate = 1.0
# Generated training set. Every node must agree on the seed.
dataset_samples = 512
dataset_seed = 20260814
# Seed for the initial parameters.
init_seed = 7
# Epochs between model checkpoints. Zero disables checkpointing.
checkpoint_interval_epochs = 25
