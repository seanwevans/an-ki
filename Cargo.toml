[package]
name = "distributed_neural_network"
version = "0.1.0"
edition = "2021"

# Optional: Add description, authors, etc.
description = "A distributed neural network system with task scheduling, load balancing, and fault tolerance"
license = "MIT"

[features]
integration-tests = []
# Enable basic tensor computations with the `tch` crate when the `tch` feature
# is activated. Keeping it optional avoids pulling in the heavy dependency for
# default builds.
tch = ["dep:tch"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full", "signal"] }
tokio-util = { version = "0.7" }
async-trait = "0.1"

# Message passing (RabbitMQ)
lapin = "2.0"

# Web framework for REST API
warp = "0.3"
tokio-postgres = { version = "0.7", features = ["with-uuid-1"] }
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
# Base64 encoding/decoding
base64 = "0.21"
bb8 = "0.9"
bb8-postgres = "0.9"

# JSON serialization/deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# UUID for unique identifiers
uuid = { version = "1", features = ["v4", "serde"] }

# Prometheus metrics collection
prometheus = "0.13"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = "0.30"
opentelemetry_sdk = { version = "0.30", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.30", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.31"

# Environment variable configuration
config = "0.11"

# Regex for validation
regex = "1"

# HMAC and JWT for security
jsonwebtoken = "8.1"
hmac = "0.12"
sha2 = "0.10"
aes-gcm = { version = "0.10", features = ["std"] }
rand = "0.8"
# TLS and PKI
rcgen = { version = "0.11", features = ["pem", "x509-parser"] }
rustls = { version = "0.21", features = ["dangerous_configuration"] }
tokio-rustls = "0.24"
webpki = "0.22"
ring = "0.16"
rustls-pemfile = "1.0"
# CLI tooling
clap = { version = "4.4", features = ["derive"] }
# Testing framework for lazy static initialization
lazy_static = "1.4"
once_cell = "1.19"
tch = { version = "0.14", optional = true }
openraft = { version = "0.9", features = ["serde"] }
openraft-memstore = "0.9"
sled = "0.34"
thiserror = "1"

[dev-dependencies]
# Testing utilities
tokio = { version = "1", features = ["full"] }
nix = { version = "0.27", features = ["signal"] }
criterion = "0.5"

