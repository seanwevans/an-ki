[package]
name = "distributed_neural_network"
version = "0.1.0"
edition = "2021"

# Optional: Add description, authors, etc.
description = "A distributed neural network system with task scheduling, load balancing, and fault tolerance"
license = "MIT"

[features]
integration-tests = []

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full", "signal"] }

# Message passing (RabbitMQ)
lapin = "2.0"

# Web framework for REST API
warp = "0.3"
tokio-postgres = "0.7"
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
# Base64 encoding/decoding
base64 = "0.21"
bb8 = "0.9"
bb8-postgres = "0.9"

# JSON serialization/deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# UUID for unique identifiers
uuid = { version = "1", features = ["v4", "serde"] }

# Prometheus metrics collection
prometheus = "0.13"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = "0.30"
opentelemetry_sdk = { version = "0.30", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.30", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.31"

# Environment variable configuration
config = "0.11"

# Regex for validation
regex = "1"

# HMAC and JWT for security
jsonwebtoken = "8.1"
hmac = "0.12"
sha2 = "0.10"
aes-gcm = { version = "0.10", features = ["std"] }
rand = "0.8"
# Testing framework for lazy static initialization
lazy_static = "1.4"

[dev-dependencies]
# Testing utilities
tokio = { version = "1", features = ["full"] }
nix = { version = "0.27", features = ["signal"] }

