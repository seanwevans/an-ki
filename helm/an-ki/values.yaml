global:
  imageRepository: an-ki
  # Defaults to the chart appVersion when left empty, so a released chart
  # pins the image it was tested against instead of floating on `latest`.
  imageTag: ""
  amqpAddr: amqp://rabbitmq:5672/%2f
  jwtSecretKey: change-me
  databaseUrl: postgresql://user:pass@db:5432/app

principal:
  replicas: 1
  # Where the Raft log and state machine are stored inside the container. This
  # path is backed by a per-replica PersistentVolumeClaim.
  raftDataDir: /var/lib/an-ki/raft
  raftDataSize: 1Gi
  # Port principals exchange Raft RPCs on.
  raftPort: 4001
  # Leave empty to use the cluster's default StorageClass.
  storageClassName: ""

an:
  replicas: 1

ki:
  replicas: 1
